[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmaps-review-filter"
version = "0.1.0"
description = "Filter Google Maps reviews to detect fake reviews and compute trusted average rating"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["google-maps", "reviews", "scraping", "playwright"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.59.0",
]

[project.scripts]
gmaps-filter = "gmaps_review_filter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmaps_review_filter"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "BLE", "S"]
# Best-effort DOM probing against hostile, ever-changing markup: broad
# excepts and try/except-pass|continue are the deliberate pattern here,
# not sloppiness. Everything else stays enforced.
ignore = ["BLE001", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: network end-to-end checks against fixed Google Maps spots",
]

[tool.coverage.run]
source = ["gmaps_review_filter"]
relative_files = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/gmaps_review_filter", "scripts"]
mypy_path = ["src", "."]

[tool.coverage.report]
# Overall floor; pure modules additionally hold a 100% gate in CI (see
# the coverage-pure step) so untested branches cannot hide in the average.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
