[project]
name = "gmaps-review-filter"
version = "0.1.0"
description = "Filter Google Maps reviews to detect fake reviews and compute trusted average rating"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.59.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "BLE", "S"]
# Best-effort DOM probing against hostile, ever-changing markup: broad
# excepts and try/except-pass|continue are the deliberate pattern here,
# not sloppiness. Everything else stays enforced.
ignore = ["BLE001", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
